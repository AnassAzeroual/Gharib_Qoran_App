name: Deploy Flutter Web to GitHub Pages

# Builds the Flutter web app (in quran-app/) and publishes it to GitHub Pages
# using the official Pages Actions path (Settings -> Pages -> Source must be
# "GitHub Actions"). The book resources (page images + JSON) are generated at
# build time from the repo's own pages/ folder via sync_resources.py.

on:
  push:
    branches: [main]
    paths:
      - "quran-app/**"
      - "pages/**"
      - "menu.json"
      - "thumun-menu.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # needed to delete stale artifacts

# Only one deploy at a time; cancel superseded runs so old ones don't leave
# competing "github-pages" artifacts behind.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Single job: build AND deploy in one run so exactly one github-pages
  # artifact exists when deploy-pages runs (prevents the "Multiple artifacts"
  # collision that happens when a separate build job / re-run leaves extras).
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Delete any leftover "github-pages" artifacts from earlier failed runs
      # so deploy-pages never sees more than one.
      - name: Delete stale github-pages artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const stale = res.data.artifacts.filter(a => a.name === 'github-pages');
            for (const a of stale) {
              core.info(`Deleting stale artifact ${a.id} (${a.name})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: a.id,
              });
            }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate book resources (images + JSON + indexes)
        working-directory: quran-app
        run: python sync_resources.py

      - name: Install dependencies
        working-directory: quran-app
        run: flutter pub get

      - name: Build web
        working-directory: quran-app
        run: flutter build web --release --base-href /Gharib_Qoran_App/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quran-app/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
